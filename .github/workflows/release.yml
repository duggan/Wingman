name: Release

# Builds, signs (Developer ID), notarizes and staples Wingman.dmg using
# `make release`. Run it manually (Actions > Release > Run workflow) to get the
# DMG as a build artifact, or push a `v*` tag to also attach it to a GitHub
# release.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   DEVELOPER_ID_CERT_P12       base64 of the exported "Developer ID Application"
#                               certificate + private key (.p12):
#                                 base64 -i cert.p12 | pbcopy
#   DEVELOPER_ID_CERT_PASSWORD  password you set when exporting the .p12
#   NOTARY_APPLE_ID             Apple ID used for notarization
#   NOTARY_PASSWORD             app-specific password for that Apple ID
#                               (https://appleid.apple.com)
# The Team ID and signing identity come from the Makefile (TEAM_ID / SIGN_ID).

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      KEYCHAIN: ${{ runner.temp }}/wingman-build.keychain-db
    steps:
      - uses: actions/checkout@v5

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Import signing certificate into a temporary keychain
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KC_PASS="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KEYCHAIN"
          # Make it the default + first in the search list so codesign and
          # notarytool (which both use the default keychain) find everything.
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Store notarization credentials
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          TEAM_ID="$(make -s -pn 2>/dev/null | sed -n 's/^TEAM_ID := //p' | head -1)"
          xcrun notarytool store-credentials wingman \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$TEAM_ID" \
            --password "$NOTARY_PASSWORD" --keychain "$KEYCHAIN"

      - name: Build, sign, notarize and staple
        run: make release

      - uses: actions/upload-artifact@v4
        with:
          name: Wingman-dmg
          path: build/Wingman.dmg
          if-no-files-found: error

      - name: Attach DMG to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" build/Wingman.dmg --clobber

      - name: Remove temporary keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" || true
