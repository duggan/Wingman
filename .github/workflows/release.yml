name: Release

# Builds, signs (Developer ID), notarizes and staples Wingman.dmg using
# `make release`. What gets published depends on the trigger:
#
#   tag v1.2.3          -> GitHub release (marked latest)
#   tag v1.2.3-rc1      -> GitHub pre-release (any tag with a "-" suffix)
#   push to test/**     -> pre-release `test-<branch>-<sha>` for that branch, so
#                          an issue reporter can download a build of the fix
#   manual dispatch     -> run it on any branch (pick it in the "Use workflow
#                          from" dropdown). Always uploads the DMG as a build
#                          artifact; tick "publish" to also create the
#                          `test-<branch>-<sha>` pre-release.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   DEVELOPER_ID_CERT_P12       base64 of the exported "Developer ID Application"
#                               certificate + private key (.p12):
#                                 base64 -i cert.p12 | pbcopy
#   DEVELOPER_ID_CERT_PASSWORD  password you set when exporting the .p12
#   NOTARY_APPLE_ID             Apple ID used for notarization
#   NOTARY_PASSWORD             app-specific password for that Apple ID
#                               (https://appleid.apple.com)
# The Team ID and signing identity come from the Makefile (TEAM_ID / SIGN_ID).

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Also publish a test pre-release for this branch"
        type: boolean
        default: false
  push:
    tags: ["v*"]
    branches: ["test/**"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # The `runner` context isn't available in job-level `env`, so derive the
      # keychain path from $RUNNER_TEMP here and export it to later steps.
      - name: Set keychain path
        run: echo "KEYCHAIN=$RUNNER_TEMP/wingman-build.keychain-db" >> "$GITHUB_ENV"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Import signing certificate into a temporary keychain
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KC_PASS="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KEYCHAIN"
          # Make it the default + first in the search list so codesign and
          # notarytool (which both use the default keychain) find everything.
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Store notarization credentials
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          TEAM_ID="$(sed -n 's/^TEAM_ID *:= *//p' Makefile)"
          test -n "$TEAM_ID"
          xcrun notarytool store-credentials wingman \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$TEAM_ID" \
            --password "$NOTARY_PASSWORD" --keychain "$KEYCHAIN"

      - name: Build, sign, notarize and staple
        run: make release

      - uses: actions/upload-artifact@v4
        with:
          name: Wingman-dmg
          path: build/Wingman.dmg
          if-no-files-found: error

      - name: Work out what to publish
        id: plan
        env:
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          SHORT="${GITHUB_SHA::7}"
          SLUG="$(echo "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9\n' '-' | sed 's/--*/-/g; s/^-//; s/-$//')"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then echo "kind=prerelease" >> "$GITHUB_OUTPUT"
            else echo "kind=release" >> "$GITHUB_OUTPUT"; fi
          elif [[ "$GITHUB_EVENT_NAME" == push || "$PUBLISH_INPUT" == "true" ]]; then
            echo "tag=test-$SLUG-$SHORT" >> "$GITHUB_OUTPUT"
            echo "kind=test" >> "$GITHUB_OUTPUT"
          else
            echo "kind=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release
        if: steps.plan.outputs.kind != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          KIND: ${{ steps.plan.outputs.kind }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            case "$KIND" in
              release)
                gh release create "$TAG" --verify-tag --generate-notes ;;
              prerelease)
                gh release create "$TAG" --verify-tag --generate-notes --prerelease ;;
              test)
                gh release create "$TAG" --target "$GITHUB_SHA" --prerelease \
                  --title "Test build: $GITHUB_REF_NAME @ ${GITHUB_SHA::7}" \
                  --notes "Test build of branch \`$GITHUB_REF_NAME\` at $GITHUB_SHA. Not a stable release." ;;
            esac
          fi
          gh release upload "$TAG" build/Wingman.dmg --clobber

      - name: Remove temporary keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" || true
